name: Verify ONLY chosen YouTube channels (no publishing)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-tiktok.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YouTube metadata checker
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check exact approved channels - NO uploads or publishing
        run: python probe_sources.py
